name: EAS Update

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps && npm install fs-extra --legacy-peer-deps

      - name: Publish update
        run: eas update --auto --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Notify agent on failure
        if: failure()
        run: |
          curl -s -X POST "https://agent-swarm-ceti.onrender.com/ci-error" \
            -H "Content-Type: application/json" \
            -d "{\"error\": \"EAS Update failed. Check logs at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
