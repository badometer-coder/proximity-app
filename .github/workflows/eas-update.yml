name: EAS Update

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps && npm install fs-extra --legacy-peer-deps

      - name: TypeScript check
        id: tsc
        run: npx tsc --noEmit --skipLibCheck 2>&1 | tee /tmp/tsc-output.txt; exit ${PIPESTATUS[0]}

      - name: Publish update
        run: eas update --channel preview --message "${{ github.event.head_commit.message }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: https://nnlwhgpjmjnzmxeslbks.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ubHdoZ3BqbWpuem14ZXNsYmtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTQ0MTAsImV4cCI6MjEwMDQ3MDQxMH0.G8VQSJSG8cSiYbiuUt8bs_LOBp_LoGaWPs4AE4d2j28

      - name: Notify agent on failure
        if: failure()
        run: |
          TSC_ERRORS=$(cat /tmp/tsc-output.txt 2>/dev/null | grep "error TS" | head -10 || echo "See logs")
          PAYLOAD=$(jq -n --arg err "CI failed. TypeScript errors:\n${TSC_ERRORS}\nFull logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{"error": $err}')
          curl -s -X POST "https://agent-swarm-ceti.onrender.com/ci-error" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
